<div
  class="rounded-lg border-2 drop-shadow-md dark:border-slate-800 border-slate-50 dark:bg-slate-800 m-5 p-5 bg-slate-50">
  <header class="mb-6">
    <h4 class="font-bold "><a href="{{project.html_url}}" class="hover:text-yellow-500">{{ project.name }}</a> &nbsp;
      <img ngSrc="star.png" [width]="15" [height]="15" class="inline" alt="star icon"/> {{ project.stargazers_count }}
      <img ngSrc="git-fork.svg" [width]="20" [height]="20" alt="git fork icon" class="inline svg-theme dark:svg-theme">
      {{ project.forks }}
    </h4>
  </header>
  <article class="sm:min-h-52 lg:min-h-36 xl:min-h-28">
    <span>{{ project.description }}</span>
  </article>
  <footer class="mt-6">
    <div class="grid grid-cols-2 max-sm:grid-cols-1">
      <p class="text-left">
        @if (project?.homepage && !project?.homepage?.includes('github.io')) {
          <span><span class="text-red-500 animate-pulse">Live url: </span><a
            class="hover:text-yellow-500 cursor-pointer"
            [href]="project.homepage"
            target="_blank">{{ project.homepage }}</a></span>
        }
      </p>
      <p class="max-sm:text-left text-end">
        <span>Updated on: {{ project.updated_at | date:'dd/LL/yyyy' }}</span>
      </p>
    </div>
  </footer>
</div>
